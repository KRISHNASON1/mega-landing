# Google Cloud Build configuration for MEGA Enterprise Landing
# This file automates building and deploying to Cloud Run

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mega-enterprise-landing:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mega-enterprise-landing:latest'
      - '.'
    timeout: '600s'

  # Step 2: Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mega-enterprise-landing:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mega-enterprise-landing:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mega-enterprise-landing'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mega-enterprise-landing:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production,SMTP_HOST=${_SMTP_HOST},SMTP_PORT=${_SMTP_PORT},SMTP_SECURE=${_SMTP_SECURE},SMTP_USER=${_SMTP_USER},SMTP_PASSWORD=${_SMTP_PASSWORD},EMAIL_FROM=${_EMAIL_FROM},EMAIL_TO=${_EMAIL_TO}'

# Substitution variables (defaults, can be overridden)
substitutions:
  _REGION: 'asia-southeast1'
  _SMTP_HOST: 'smtpout.secureserver.net'
  _SMTP_PORT: '465'
  _SMTP_SECURE: 'true'
  _SMTP_USER: ''
  _SMTP_PASSWORD: ''
  _EMAIL_FROM: ''
  _EMAIL_TO: ''

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Container images to store
images:
  - 'gcr.io/$PROJECT_ID/mega-enterprise-landing:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/mega-enterprise-landing:latest'

timeout: '1200s'
